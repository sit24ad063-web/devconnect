version: "3.8"

# Local PostgreSQL for development. In production, point DATABASE_URL at
# Neon (or any managed Postgres) instead — see README "Deployment".
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devconnect
      POSTGRES_PASSWORD: devconnect
      POSTGRES_DB: devconnect
    ports:
      - "5432:5432"
    volumes:
      - devconnect_pgdata:/var/lib/postgresql/data

volumes:
  devconnect_pgdata:
